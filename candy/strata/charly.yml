strata:
    candy:
        # Strata — the Qwen3.8-Flash-Next inference engine, as a rootless OpenCharly layer.
        #
        # Everything below follows three ledger decisions that were settled with the operator on
        # 2026-10-16 (opencharly/opencharly, plan/strata-layer-and-pod.md): the engine is BAKED at
        # image build so the first start never compiles it (D6), the model store is a host path the
        # operator defines under their XDG data directory (D15/D16), and the configuration is
        # charly.yml fields plus a charly-authored overlay merged by mechanism (a) (D12).
        #
        # The pictures-on-by-default change (2026-10-21) has its decisions in THIS repo's `LEDGER.md`
        # (V1-V8) rather than in that plan document, which is referenced throughout this family but
        # is ABSENT from opencharly/opencharly's origin/main -- recorded as open item O1 in LEDGER.md,
        # because a citation that cannot be resolved is a stale claim, not a reference.
        description: |
            Strata — the Qwen3.8-Flash-Next inference engine (125B MoE) serving an OpenAI- and
            Anthropic-compatible API on port 8080, with the engine compiled INTO THE IMAGE exactly
            the way upstream's own Dockerfile compiles it.

            Four properties matter to a consumer:

            - **The engine is baked, so the first start never compiles.** `engine/BUILD.json`
              records `source: "local"` with the matching source hash, which is what makes
              `setup.py` reuse the engine instead of rebuilding it. The stamp is written only
              after a successful build AND the runtime checks the binary self-reports the stamped
              version, because upstream #2054 shows a *failed* build can leave a stamp that lies.
            - **Pictures are on by default.** `VISION: cpu` reads images with the image encoder on
              the CPU (nothing is taken from the card), and the charly vision pass applies it on
              EVERY start — not only the first, because the run config's `vision` section is written
              by `setup.py`, which never runs again once the config exists. `VISION: gpu` reads them
              on the card, `VISION: no` turns them off. The encoder BINARY is baked into the image;
              the encoder FILE (0.9 GB of model data) is fetched once into the model store and reused.
            - **The model store is yours, mounted not baked.** The weights are 37-188 GB and are
              licensed separately from the MIT engine (Qwen Community License 1.0 / Apache-2.0 /
              Swift Open License), so they never enter the image. `/data` is a named volume here
              and a *host bind* on the deployment: `host: ~/.local/share/strata` is the committed
              default, because that is `$XDG_DATA_HOME`'s default and charly expands `~`/`$HOME`
              but not `$XDG_*` (see opencharly/spec#260).
            - **The whole configuration is the deployment's `env:`.** The setup choices are the
              engine's own documented variables — FAMILY, MODEL, CONTEXT, VISION, KV, GPU, GPUS,
              LAYER_SPLIT, LOW_RAM, GGUF_DIR, RESIDENT_BUDGET_GIB, KV_STREAMING, REINSTALL — with
              the candy's `var:` as the documented default; `STRATA_RUN_ARGS` carries an external
              model's extra engine argv (a community pack's `--pack/--native/--ple-gguf/--mtp`),
              and the server-behaviour keys come from the charly-authored overlay in
              `/opt/strata/charly-overlay.json`.

            It runs **rootless**: no privileged container, no root-owned host path. `HOST` stays
            `0.0.0.0` because the pod publishes the port, which is why `STRATA_API_KEY` is a
            `secret_require` — upstream's own advice is "always set a key" before exposing the
            port. `/health` is answered before the API-key gate, so a probe needs no secret.

            The weights are NOT in this image and no first start is triggered by building it.
        require:
            - '@github.com/opencharly/layer-supervisord:v2026.288.2336'
            # The GPU stack is intrinsic, unlike the `ollama` candy's deliberately GPU-agnostic
            # declaration: Strata has NO CPU-only mode and its engine is compiled with
            # -DSTRATA_ENABLE_CUDA=ON, so nvcc is a BUILD-time requirement (ledger D4).
            - '@github.com/opencharly/layer-nvidia:054aa7702ebe79e8be444764f91a03933ba45eec'
            # Bumped v2026.289.1250 -> v2026.289.1454 -> v2026.289.1504. Two producer fixes, both
            # required before this family can build at all: #9's header-root/subtree/extension repair
            # (layer-cuda#10, tag v2026.289.1454) and nvcc's missing sibling tree /usr/nvvm, without
            # which the backend compiler is not found (layer-cuda#11, tag v2026.289.1504).
            # Producer-first: every tag existed before this pin moved.
            - '@github.com/opencharly/layer-cuda:d075bd36ef566ef2783a84c1a96eea0e300f6469'
            # NOTE -- distro-cachyos is deliberately NOT bumped to its newest tag (v2026.289.0901), even
            # though a newer one exists in the BOX's import below. Part II #3 requires every `distro-*` pin
            # to equal CHARLY's own gitlink, and charly's gitlink (673b1b6b90ab) resolves exactly to
            # v2026.281.1001 -- the same commit the umbrella pins. "Newest" is the wrong rule for a
            # distro-* pin; alignment is.
            # gcc/g++/make/pkg-config for the engine bake. cmake and ninja come from
            # requirements.txt into the venv, so they are deliberately NOT system packages.
            - '@github.com/opencharly/layer-build-toolchain:v2026.271.1840'
        var:
            # ---- the BUILD-time surface (upstream's Dockerfile ARGs; ledger D6 / §5.2.1b) ----
            # A post-2026-10-06 tag, never `main`: the repo's history was rewritten and a
            # `main` URL would also poison the download verb's content-addressed cache.
            STRATA_VERSION: v0.1.44.1
            # Upstream's own pinned ggml source; the engine does not build against anything else.
            STRATA_LLAMA_COMMIT: 3cf03257f219afbe7334045ff7c6a06ac68c627d
            # docker build has no GPU, so the CUDA architectures are fixed here. 75=RTX20,
            # 86=RTX30, 89=RTX40, 120=RTX50, 80=A-series; CMakeLists refuses anything below 75.
            # Narrow it per image for a much faster build (box/strata pins 89).
            STRATA_CUDA_ARCHS: "75;80;86;89;120"
            # "0" skips the image-encoder build (it is optional; VISION selects its use).
            STRATA_BUILD_VISION: "1"
            # Non-AVX2 hosts need a differently compiled engine ("avx" or "none").
            STRATA_ISA_FLOOR: ""
            # ---- the setup-choice DEFAULTS (ledger §5.2.1) ----
            # Every one of these is a Layer-A field: a deployment's `env:` overrides it, and the
            # value flows through the engine's own documented variable of the same name. Nothing
            # is renamed.
            FAMILY: qwen
            MODEL: IQ2_XS
            # 64K, not the engine's own recommendation for a small card (ledger V9): `own_path_context`
            # returns 32768 at <=16.5 GB of VRAM. 64K is what an agent client actually needs -- a
            # Hermes Agent turn measures ~12K prompt tokens before it does anything -- and it is
            # affordable because the KV cache STREAMS to system RAM from 64K up, which needs the
            # `--kv-resident` flag STRATA_RUN_ARGS below carries and the reserve that goes with it.
            # Measured on a 16 GB card: 64K serves, 0.9 GB of KV in RAM, 80.7% expert-cache hit rate.
            #
            # CONTEXT is an INSTALL-TIME choice: setup.py records it as the config's `--max-context`,
            # and an installed config keeps its recorded value (unlike VISION, which had no reachable
            # surface at all). An existing deployment moves it with STRATA_RUN_ARGS -- see README.
            CONTEXT: "65536"
            # PICTURES ARE ON BY DEFAULT (ledger V1). `cpu` reads them on the CPU: it takes nothing
            # from the card, and the expert cache of this engine already runs VRAM-tight (measured on
            # the 16 GB bed venue: 413 MiB free with everything loaded). `gpu` reads them on the card
            # and costs ~1.2-1.4 GB of VRAM; `no`/`off` turns them off. `yes`/`on` are accepted as
            # aliases for `cpu` and SAY SO, because at the pinned tag setup.py maps `--vision yes` to
            # the GPU reader -- upstream measured that reader SLOWER for text on a 16 GB card
            # (46.0 vs 48.4 tok/s), so the alias is deliberately not upstream's mapping.
            #
            # This reaches the engine through the charly vision pass (ledger V2) on EVERY start,
            # not only the first: setup.py writes the run config's vision section, and setup.py does
            # not run again once the config exists.
            VISION: cpu
            # The encoder is MODEL DATA (0.9 GB, licensed with the weights): it is fetched ONCE into
            # the model store (/data/vision/) and reused, never baked into the image -- the same rule
            # the weights follow. The SOFTWARE beside it (the `strata-vision` binary, 222 MB) IS in
            # the image, built by charly-build-engine.py, and two build-context checks below assert
            # it. Upstream ships an encoder per family and none for `qwen36`; a model outside that
            # table (a community fine-tune) names its own file here -- measured workable on the ORCA
            # pack with the base model's encoder, but a deployment's claim to make, not a default.
            VISION_MMPROJ_URL: ""
            VISION_MMPROJ: ""
            # The CPU reader's thread count (upstream's own rule: half the cores) and the most image
            # tokens a picture may become (upstream's device defaults: 300 on the CPU, 1024 on the
            # card). Empty means those defaults.
            VISION_THREADS: ""
            VISION_TOKENS: ""
            KV: ""
            GPU: ""
            GPUS: ""
            LAYER_SPLIT: ""
            # Always passed downstream: setup.py measures RAM from /proc/meminfo, which in a
            # container is the host's total, not the cap, so a capped container must ask for
            # the low-RAM mode itself.
            LOW_RAM: auto
            RESIDENT_BUDGET_GIB: ""
            KV_STREAMING: ""
            # Image-wide on purpose: the pod publishes the port, so 0.0.0.0 is right here and
            # this is not a per-deployment knob.
            HOST: 0.0.0.0
            PORT: "8080"
            GGUF_DIR: ""
            STRATA_DATA: /data
            # Which engine the entrypoint runs: "strata" (the real one) or "mock" (upstream's
            # scripted, GPU-free, model-free mode for clients and tests). The deterministic bed
            # sets it to `mock`; a real deployment never sets it.
            STRATA_ENGINE: strata
            # The server-behaviour keys (Layer B) the operator wants, as a JSON object, merged into
            # the run config on the volume at every start. Anything the engine accepts at runtime may
            # go here EXCEPT its own setup-recorded keys -- the merge helper refuses those, because a
            # settings pass rewrites them. Empty means the baked defaults in STRATA_OVERLAY apply.
            # The key names are not listed on purpose: `charly strata config` (or GET /config) is the
            # engine's own published catalogue, and a copy here would drift from it.
            STRATA_OVERLAY_JSON: ""
            # A deployment-supplied EXTRA engine argv (Layer C), shell-quoted, merged into the run
            # config's `args` at every start. This is the surface for a model outside setup.py's
            # menu -- a community pack with its own --pack/--native/--ple-gguf/--mtp: each named
            # flag has its value replaced in place (or is appended when absent).
            #
            # The DEFAULT is the VRAM reserve that a 64K context needs on a small card (ledger V9).
            # Measured on the 16 GB venue at 64K: with the engine's own 700-MiB default it reported
            # 413 MiB free per request and warned that the driver can page GPU memory to system RAM
            # (upstream #2065); at 960 it still measured 509 MiB -- 3 MiB under the engine's 512
            # threshold -- and the engine asked for 1024, which clears it (673 MiB free at load,
            # 80.7% expert-cache hit rate). A deployment that sets this variable owns the WHOLE
            # string, so include your own reserve (and --kv-resident when you raise the context)
            # rather than expecting the default to merge with yours.
            STRATA_RUN_ARGS: "--vram-reserve-mib 1024"
            # The overlay the entrypoint merges into the run config on the volume (Layer B).
            STRATA_OVERLAY: /opt/strata/charly-overlay.json
        distro:
            arch:
                package:
                    # `python` on Arch IS python3; setup.sh needs an interpreter >= 3.10 to build
                    # the venv. Declared rather than assumed, and idempotent where the base
                    # already carries it.
                    - python
        port:
            - 8080
        volume:
            # A NAMED volume only — a candy can never pin a host path (ledger §4.8/D15): the
            # deploy binds it (`{name: strata-data, type: bind, host: ~/.local/share/strata,
            # path: /data}`) or `charly config strata --bind strata-data` does.
            - name: strata-data
              path: /data
        secret_accept:
            # OPTIONAL by contract: a LOCAL strata deployment runs with no API key and therefore
            # serves /v1/* openly. Set one only when the endpoint is reachable by someone else
            # (a published host port on a shared network); the entrypoint projects this ENV name
            # to the `API_KEY` name upstream's contract reads. An unset value means the entrypoint
            # passes NO `--api-key` flag at all — the engine REJECTS an empty one ("an API key was
            # given but it is empty"), so omitting the flag is what "no auth" actually requires.
            - name: STRATA_API_KEY
              description: >-
                  OPTIONAL Bearer / x-api-key token for /v1/*. Unset by default so a local pod
                  serves openly; set it when the port is exposed beyond the host.
                  /health stays pre-auth either way, so a liveness probe needs no secret.
        env_provide:
            # Product-scoped only. A generic OPENAI_BASE_URL would silently redirect every
            # OpenAI-speaking service in the same pod, so consumers opt in with env_accept.
            STRATA_BASE_URL: "http://{{.ContainerName}}:8080/v1"
        service:
            - name: strata
              # The charly-owned entrypoint: env -> overlay merge -> upstream's own install/launch
              # flow (mechanism (a), ledger D12). It also implements the GPU-free `--engine mock`
              # posture the deterministic bed uses (D7).
              exec: /opt/strata/charly-entrypoint.sh
              # NOT supervisord's 10 s default: the engine releases tens of GB of page-locked RAM
              # on SIGTERM, and a too-early SIGKILL leaves stale VRAM and a wedged GPU hand-off.
              # Integer form, and a MASK: the schema also permits "90s", but charly writes the
              # value verbatim into supervisord's stopwaitsecs, which parses an int - so the
              # duration form kills the service (ledger §89; filed against charly).
              stop_timeout: 90
              restart: always
              enable: true
        plan:
            # Fetch with GIT METADATA, not as a tarball.
            #
            # Upstream's Dockerfile clones the repo, and the bake queries the tree's own git metadata
            # (that is where the ggml commit comes from). A tarball has no `.git`, so `ggml commit:`
            # resolved to "unknown" and the queries emitted
            # `fatal: not a git repository (or any of the parent directories): .git`
            # into the build log -- twice -- which the zero-error-line rule correctly counts as a gate
            # failure (R10, zero warnings). Cloning as upstream does removes both symptoms by
            # construction instead of suppressing the message, and keeps this candy faithful to D6
            # ("the engine baked exactly as upstream's Dockerfile does"). Measured: the image-build step
            # itself exited 0 after 18m22s with these two lines the only thing standing between it and a
            # pass.
            - run: fetch the pinned Strata source tree, git metadata included
              command: |
                rm -rf /opt/strata
                # Pin the release commit by fetching the tag REF and checking out FETCH_HEAD, rather than
                # with `clone --branch <tag>`. Upstream's release tags are ANNOTATED, so --branch hands git the
                # tag object's id and git warns while peeling it to the commit (git commit.c
                # lookup_commit_or_die); the build's severity-prefix recognizer counts that line, so a
                # cache-cold rebuild could never report warnings=0. Both forms land the same peeled commit;
                # this one emits no diagnostic. The exact warning text is deliberately NOT quoted here,
                # because plan comments reach the OCI description label.
                git clone --quiet --depth 1 --no-single-branch \
                  https://github.com/Niko1221/Strata /opt/strata
                git -C /opt/strata fetch --quiet --depth 1 origin "refs/tags/${STRATA_VERSION}"
                git -C /opt/strata checkout -q FETCH_HEAD
              run_as: root
            - run: install the engine-bake script (upstream's own setup.py functions)
              copy: charly-build-engine.py
              to: /opt/strata/charly-build-engine.py
              mode: "0644"
              run_as: root
            - run: install the config-merge helper
              copy: charly-merge-config.py
              to: /opt/strata/charly-merge-config.py
              mode: "0644"
              run_as: root
            - run: install the run-args merge helper
              copy: charly-merge-args.py
              to: /opt/strata/charly-merge-args.py
              mode: "0644"
              run_as: root
            # The vision pass (ledger V2): the ONE writer of the run config's setup-owned `vision`
            # section on an installed model, and the owner of the encoder file on the volume.
            - run: install the vision pass
              copy: charly-vision.py
              to: /opt/strata/charly-vision.py
              mode: "0644"
              run_as: root
            - run: install the charly entrypoint
              copy: charly-entrypoint.sh
              to: /opt/strata/charly-entrypoint.sh
              mode: "0755"
              run_as: root
            - run: create the venv and bake the engine, exactly as upstream's Dockerfile does
              command: |
                  cd /opt/strata
                  python3 -m venv .venv
                  .venv/bin/pip install --no-cache-dir --upgrade pip
                  .venv/bin/pip install --no-cache-dir -r requirements.txt
                  .venv/bin/python /opt/strata/charly-build-engine.py
                  rm -rf build build-vision
                  # The runtime runs as uid 1000 and writes .strata-pip.json into the venv;
                  # a root-owned tree makes that a hard PermissionError at first start
                  # (measured). Hand the whole tree to the runtime user here, once.
                  chown -R user:user /opt/strata
              cache:
                  - /root/.cache/pip
                  # NOT cached: /opt/strata/build and /opt/strata/third_party.
                  #
                  # Both were cached for speed, and both made the build NON-HERMETIC: they persist across
                  # builds, so the source tree and the CMake build directory seen by one run can differ
                  # from those of the next. Measured: two consecutive builds of the SAME commit reported
                  # different `ggml commit:` values at configure (`unknown` vs `3cf03257f`) and produced
                  # DIFFERENT TARGET SETS -- one had a `strata` target, the next did not
                  # ("ninja: error: unknown target 'strata'"). A gate that does not build a reproducible
                  # artifact is not a gate: it can pass, or fail, for reasons unrelated to the commit
                  # under test (R7/R10).
                  #
                  # The engine source is pinned (LLAMA_CPP_COMMIT + the pinned release tag), so re-fetching
                  # it is deterministic; the pip cache above stays because package downloads ARE reproducible
                  # and it is the slow part. Cost of this choice: a slower bake, in exchange for a gate that
                  # measures the tree that will be pushed.
              run_as: root
            # NOTE -- why `reasoning_effort` is NOT here. It is a REQUEST-body parameter, not a run-config
            # key: it appears nowhere in the engine's own config surface (verified against serve/runconfig.py
            # and serve/server.py at the pinned tag), and it demonstrably changes a response when sent in the
            # request body (measured: `none` yields non-null content where the default spends the budget on
            # thinking). Writing it into the run config would be an inert key that CLAIMS to set a behaviour
            # -- the same class of falsehood as a fabricated `ptx` in the engine stamp. The verified
            # mechanism for it is per-request; the candy's completion probe uses exactly that.
            # NOTE -- `lazy_load: true` below is reconciled, not contradicted, by the vision pass.
            # Upstream's settings validator REFUSES to set `lazy_load: true` on a config that reads
            # images (serve/runconfig.py:92; its only call site is the settings-write path), and
            # documents the key as text-only, while the LOAD path tolerates the pair (measured: the
            # engine starts and reports images: true). A fast first answer matters more for the common
            # text-only deployment, so the overlay keeps the fast path, and the vision pass -- which
            # runs after it, on every start -- turns lazy loading off WHEN it writes the section, so
            # the config stays one upstream's own API would write, and says so in one line (ledger V4).
            # One owner per fact: the deployment's policy here, the contract there.
            - run: write the server-behaviour overlay the entrypoint merges into the run config
              config: /opt/strata/charly-overlay.json
              mode: "0644"
              run_as: root
              content: |
                  {
                    "open_browser": false,
                    "aliases": ["strata", "qwen3.8-flash-next"],
                    "lazy_load": true,
                    "idle_unload_s": 900,
                    "engine_silence_s": 300,
                    "parallel": 1
                  }
            # ---- the candy's own probes: authored HERE so every composing box and bed inherits
            # them (R3 -- one copy of every probe, never repeated per bed) ----
            - check: the baked engine binary is present
              id: strata-engine-binary
              file:
                  file: /opt/strata/engine/strata
                  exists: true
            - check: the stamp records a locally baked engine, written only after a successful build
              id: strata-engine-stamp
              exit_status: 0
              command: >-
                  python3 -c "import json,sys; m=json.load(open('/opt/strata/engine/BUILD.json'));
                  sys.exit(0 if m.get('source')=='local' and m.get('archs') and m.get('src') else 1)"
            - check: the charly entrypoint, the merge helper and the overlay are installed
              id: strata-charly-files
              file:
                  file: /opt/strata/charly-entrypoint.sh
                  exists: true
            - check: the venv the engine was built in is present
              id: strata-venv
              file:
                  file: /opt/strata/.venv/bin/python
                  exists: true
            # ---- the vision SOFTWARE is in the image; its DATA never is (ledger V5) ----
            - check: the image-encoder binary is baked beside the engine
              id: strata-vision-binary
              file:
                  file: /opt/strata/engine/strata-vision
                  exists: true
            - check: the engine stamp records an encoder build, so the binary matches this engine
              id: strata-vision-stamp
              exit_status: 0
              # The same discipline as the engine's own stamp check: BUILD.json is written LAST by
              # charly-build-engine.py, so "the encoder exists" alone would not prove it was built
              # from THIS engine's source -- the stamp is what ties the two together.
              command: >-
                  python3 -c "import json,sys; m=json.load(open('/opt/strata/engine/BUILD.json'));
                  sys.exit(0 if m.get('vision') in ('cpu','gpu') and m.get('vision_src') else 1)"
            - check: the family/encoder table equals upstream's own, so a repin cannot drift it
              id: strata-vision-table
              exit_status: 0
              # The helper carries the family -> encoder table as DATA (it may not import upstream's
              # setup.py at runtime: that is ~1 GB of imports and internals the wrapper deliberately
              # does not depend on). This check is what keeps that copy honest: it compares every row
              # against setup.FAMILIES / OWN_PATH_FAMILIES IN THE BUILT IMAGE, so advancing the pin
              # fails here instead of silently pointing a deployment at the wrong encoder. A row of
              # None means "upstream ships no encoder", and is asserted to match upstream's own
              # vision: False -- that is qwen36.
              command: >-
                  /opt/strata/.venv/bin/python -c "import importlib.util,sys; sys.path.insert(0,'/opt/strata');
                  import setup; fams={**setup.FAMILIES, **setup.OWN_PATH_FAMILIES};
                  spec=importlib.util.spec_from_file_location('cv','/opt/strata/charly-vision.py');
                  cv=importlib.util.module_from_spec(spec); spec.loader.exec_module(cv);
                  bad=[];
                  [bad.append(n+': absent upstream') if n not in fams else
                   (bad.append(n+': upstream ships an encoder') if row is None and fams[n].get('vision', True) is not False else
                    (bad.append(n+': url/file differ') if row is not None and (row['url']+row['file']) != (fams[n].get('mmproj_hf','')+fams[n].get('mmproj','')) else None))
                   for n, row in cv.FAMILIES.items()];
                  print('table mismatches:', bad);
                  sys.exit(0 if not bad else 1)"
            - check: "the vision pass writes the section, reuses a present encoder, and settles lazy_load"
              id: strata-vision-pass
              exit_status: 0
              # The deterministic, GPU-free and NETWORK-free proof of the pass the deployment runs:
              # a synthetic run config, a pre-created encoder file (so the reuse path is exercised and
              # no download is attempted), and a re-run to prove idempotency. It fails on the
              # pre-change tree by construction -- there is no /opt/strata/charly-vision.py to run.
              command: >-
                  python3 -c "import json,os,pathlib,subprocess,sys,tempfile;
                  d=pathlib.Path(tempfile.mkdtemp()); (d/'vision').mkdir();
                  (d/'vision'/'mmproj-test.gguf').write_bytes(b'GGUF'+bytes(4096));
                  p=d/'strata-t.json'; p.write_text(json.dumps({'args':['--native','/x/model-00001-of-00002.gguf','--max-context','32768'],'lazy_load':True,'model_name':'t'}));
                  env=dict(os.environ, VISION='cpu', FAMILY='qwen', VISION_MMPROJ='mmproj-test.gguf',
                           VISION_MMPROJ_URL='http://127.0.0.1:1/unreachable', STRATA_DATA=str(d), VISION_THREADS='2');
                  r=subprocess.run(['python3','/opt/strata/charly-vision.py',str(p)],env=env,capture_output=True,text=True);
                  c=json.loads(p.read_text()); v=c.get('vision') or {};
                  r2=subprocess.run(['python3','/opt/strata/charly-vision.py',str(p)],env=env,capture_output=True,text=True);
                  ok=(r.returncode==0 and v.get('exe')=='/opt/strata/engine/strata-vision'
                      and v.get('mmproj')==str(d/'vision'/'mmproj-test.gguf')
                      and v.get('model')=='/x/model-00001-of-00002.gguf' and v.get('gpu') is False
                      and v.get('threads')==2 and v.get('max_tokens')==300 and c.get('lazy_load') is False
                      and r2.returncode==0 and 'already in effect' in r2.stdout);
                  print(r.stdout or r.stderr); print(r2.stdout or r2.stderr);
                  sys.exit(0 if ok else 1)"
            # NOTE -- there is deliberately NO candy-level check that RUNS the engine binary. It cannot
            # be satisfied without a device (the binary loads libcuda, which CDI injects at runtime and
            # which no build context has), so such a check would break the deterministic GPU-free bed --
            # the one bed whose entire purpose is to need no card. Its unique value, "the binary
            # self-reports the version its stamp claims", is asserted in check-strata-gpu-pod, where a
            # device exists; everything provable GPU-free is already covered by the stamp check above.
            # (This is the round-12 principle applied a second time: a probe that needs a device belongs
            # to the substrate that has one.)
            - check: the running server answers /health, which is pre-auth by design
              id: strata-health
              context: [runtime]
              http:
                  http: "http://127.0.0.1:${HOST_PORT:8080}/health"
                  status: 200
            - check: the server is up with the deployment's key and publishes the projection
              id: strata-projection
              context: [runtime]
              exit_status: 0
              # What THIS check can honestly prove: /health answers (pre-auth by design), the key the
              # deployment supplied actually reached the engine (`api_key`), and the projection FIELDS
              # are published at all. It deliberately does NOT assert the projection's VALUES.
              #
              # Why not: the deterministic bed runs the scripted engine, which is started with NO run
              # config, so `max_context` and `images` come from the engine's own defaults -- measured
              # 32768 and false. The bed's CONTEXT happens to equal that default, so an equality
              # assertion would pass by coincidence and could not fail (R7). The VALUES are asserted
              # where a real config exists: the GPU bed's own step, which is the only place the
              # env -> config -> server chain is provable.
              command: >-
                  python3 -c "import json,os,sys,urllib.request;
                  h=json.load(urllib.request.urlopen('http://127.0.0.1:8080/health'));
                  fields=('max_context','images','model');
                  sys.exit(0 if h.get('status')=='ok' and isinstance(h.get('api_key'), bool)
                             and all(f in h for f in fields) else 1)"
            - check: the API gate is real once a key is set, so /v1/models needs it
              id: strata-api-gate
              context: [runtime]
              exit_status: 0
              command: >-
                  python3 -c "import json,os,sys,urllib.request;
                  r=urllib.request.Request('http://127.0.0.1:8080/v1/models',headers={'Authorization':'Bearer '+os.environ.get('STRATA_API_KEY','')});
                  sys.exit(0 if json.load(urllib.request.urlopen(r)).get('data') else 1)"
            - check: "the gate matches this keyless deployment -- /v1/models answers 200 unauthenticated"
              id: strata-api-gate-open
              context: [runtime]
              # The key is OPTIONAL (secret_accept): a local pod with no key serves /v1/* openly,
              # and a pod WITH one must refuse an unauthenticated read. Asserting a fixed 401
              # regardless would make a keyless local deployment permanently red, and asserting a
              # fixed 200 would leave a configured key unproven. The negative control therefore
              # keys off whether this deployment supplied a secret.
              # This bed deploys the LOCAL posture: the key is optional and unset, so /v1/*
              # is served openly. A declarative 200 is the honest assertion — the previous
              # shell test read STRATA_API_KEY, which an assert-only step does not export, so
              # it was DEAD (measured: "assertion is DEAD ... STRATA_API_KEY is empty").
              # The keyed posture is covered by the candy's secret_accept contract, not here.
              http:
                  http: "http://127.0.0.1:${HOST_PORT:8080}/v1/models"
                  status: 200
            - check: "a completion round-trips, with reasoning_effort none and room for the answer"
              id: strata-completion
              context: [runtime]
              exit_status: 0
              # The engine loads ~64 GB of weights after the server starts listening, so the first
              # completion can wait longer than any per-request timeout. `eventually` is the
              # documented poll-until-pass matcher (verb catalog, "Step fields"), not a sleep: the
              # FIRST pass returns immediately, and a failure reports its attempt count and elapsed
              # time rather than a bare timeout. Measured: check-live took 41s in the failing run
              # versus 10s once the load had been given room.
              eventually: "300s"
              retry_interval: "5s"
              # Two measured traps sit behind this probe, either of which would make it assert
              # nothing: the engine defaults to thinking, and a small max_tokens truncates the
              # answer to `content: null` with finish_reason "length" (measured at 16 tokens).
              # With reasoning_effort none AND max_tokens 64 the content is non-null and
              # finish_reason is "stop".
              command: >-
                  python3 -c "import json,os,sys,urllib.request;
                  body=json.dumps({'model':'strata','messages':[{'role':'user','content':'say hi'}],'max_tokens':64,'reasoning_effort':'none'}).encode();
                  r=urllib.request.Request('http://127.0.0.1:8080/v1/chat/completions',data=body,headers={'Content-Type':'application/json','Authorization':'Bearer '+os.environ.get('STRATA_API_KEY','')});
                  c=json.load(urllib.request.urlopen(r))['choices'][0];
                  sys.exit(0 if c['message'].get('content') and c.get('finish_reason')=='stop' else 1)"

strata-layer-skill:
    skill:
        name: strata-layer
        family: strata
        owner: strata
        triggers:
            - 'the strata layer / composing an image that must SERVE the Strata engine'
            - 'the Strata engine baked into an image / the setup-choice surface / the env: config overlay'
        category: images
