strata:
    candy:
        # The Strata family's image, and — as of the v0.2.16 cutover — the FINAL composition (ledger
        # D-2): the POD contract as the base, and exactly one candy on top of it.
        #
        # `base: pod-cdi.pod-cdi` is the point of the change, not a convenience. A pod does not own
        # its GPU driver: the kernel module is host-global, so the driver user-space arrives per
        # container from the NVIDIA container toolkit's CDI spec. An image that bakes its own
        # user-space SHADOWS the injected one — `nvidia-smi` then dies with "Driver/library version
        # mismatch" and anything that sizes memory through NVML silently degrades (measured:
        # opencharly/layer-cuda#21) — which is exactly what the previous `base: cachyos.cachyos` plus
        # the VM-contract GPU stack did, on an image deployed as a pod. `opencharly/pod-cdi` is the
        # repo that holds the other side of that contract: nothing nvidia-baked, the driver injected,
        # and build-time steps that FAIL if a host-coupled driver library survives.
        #
        # The namespace import below (`import:` in the root charly.yml) is what makes the qualified
        # ref resolvable; it is pinned to a MERGED tag, and its own `require:` is the one that decides
        # which `layer-cuda` release the toolkit strip comes from. This repo declares no GPU pin of
        # its own, so the two can never disagree about the contract.
        enabled: true
        base: pod-cdi.pod-cdi
        # NOTE — the build's CUDA architectures are upstream's released fat package
        # (sm_75/sm_86/sm_89/sm_120 + compute_120) because the engine is now DOWNLOADED rather than
        # compiled: there is no per-image arch narrowing to ask for, and no nvcc in the build. The
        # component's own resolver picks the code path for the card at start time.
        candy:
            # The local candy by name; its `require:` pulls the POD GPU contract and supervisord.
            - strata
        security:
            # The workload never needs to escalate: it runs as uid 1000 under supervisord and the GPU
            # arrives as a CDI device, not as a privilege. Measured on this image with the CDI device
            # and a bind volume, under `--userns=host --user 0 --cap-drop ALL
            # --security-opt no-new-privileges`, the whole chain runs — supervisord, `strata` RUNNING,
            # `Engine 0.1.62 (cuda) is installed`, `components engine` `usable: true, signed: true`, the
            # bind writable and host files owned by 1000 — while `podman info` reports `rootless=true`.
            # So this option makes an ALREADY-TRUE zero-escalation posture enforced instead of
            # incidental. It unions onto the deploy's own security args (the deploy's `security_opt`
            # is a list these are appended to), so it hardens every consumer of the image.
            #
            # `--userns=host` is upstream-of-us, not a choice made here: the pod deploy emits it for a
            # unit that carries a CDI device (opencharly/plugin-deploy-pod#82), because the kernel's
            # idmapped-mount path (`mount_setattr AT_RECURSIVE MOUNT_ATTR_IDMAP`) needs CAP_SYS_ADMIN in
            # the user namespace that owns the filesystem's superblock, and a rootless container cannot
            # idmap HOST files. Under `userns=host`, container uid 0 IS the invoking host user, so
            # `User=0:0` in the unit is the same person, not a root escalation.
            #
            # `cap_drop` is not expressible in this schema; filed as a schema gap rather than worked
            # around (see the PR body's `## Filed issues`).
            security_opt:
                - no-new-privileges

strata-skill:
    skill:
        name: strata
        family: strata
        owner: strata
        triggers:
            - 'the Strata box / the Qwen3.8-Flash-Next inference engine / an OpenAI- or Anthropic-compatible API on port 8080'
            - 'deploying a local 125B-class model server on one consumer GPU'
            - 'a service that needs an OpenAI- or Anthropic-speaking endpoint on the host'
