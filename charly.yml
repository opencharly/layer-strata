# layer-strata — the Strata family: the inference-engine layer, its image, and the beds.
#
# The class is deliberate (umbrella `AGENTS.md`, "Repo classes and naming"): a product family is a
# `layer-<family>` repo, never a bare name. This repo holds the candy, the image and the disposable
# beds for Strata — the same shape as `layer-openclaw`.
repo: github.com/opencharly/layer-strata
defaults:
    # The org registry, under `defaults:` — the schema's home for it. A TOP-LEVEL `registry:` is rejected
    # ("#NodeDoc.registry: conflicting values … (mismatched types string and struct)"), which is how the
    # first attempt at this failed.
    #
    # Without it the BUILD tags the image `localhost/strata:<check-tag>` while the pod deploy resolves
    # `ghcr.io/opencharly/strata:<check-tag>`, so the deploy cannot see the freshly built image and tries
    # to pull it instead. Measured on a full bed run (image-build PASS 17m7s, check-image PASS 39/0,
    # deploy-add PASS, then `charly config: unable to copy from source
    # docker://ghcr.io/opencharly/strata:check-strata-gpu-pod-…`). Invisible to `box validate`, to `box
    # generate`, to the image build and to all thirty-nine image checks: every one of them works on the
    # locally-tagged artifact, and only the deploy compares the built identity with the deployed one.
    # Declared to parity with the working sibling family repo (`layer-openclaw`), which is what the
    # comparison keeps proving: `platform: [linux/amd64]` + a pac-based build. Its `builder:` block is
    # deliberately NOT copied — that selects pixi/npm multi-stage builders this box does not use.
    platform:
        - linux/amd64
    tag: auto
    registry: ghcr.io/opencharly
    build:
        - pac
import:
    # The CachyOS image family, imported as a namespace so the box can say `base: cachyos.cachyos`.
    # Pinned to the same tag `layer-openclaw` uses; advanced only by `charly box reconcile`.
    - cachyos: '@github.com/opencharly/distro-cachyos:v2026.290.2137'
discover:
    - path: candy
      recursive: true
    - path: box
      recursive: true

# check-strata-gpu-pod is the family's ONLY bed: PR #6 withdrew the GPU-free mock bed. It is the
# real-engine witness and needs the GPU venue plus a provisioned 40+ GB model store, so it is run
# on demand rather than in the default roster. `STRATA_ENGINE=mock` remains a RUNTIME posture of
# the candy, not a bed; a consumer's box inherits the candy's probes without another bed.
# check-strata-gpu-pod — the family's REAL-engine witness.
#
# This is the only bed that exercises the compiled engine, the page-locking path, the multi-GB
# model load and the actual API round-trip. It therefore needs two things the deterministic bed
# does not: the GPU venue (`requires_shared: [nvidia-gpu]` -> CDI, with the arbiter flipping the
# card vfio->nvidia and back) and a PROVISIONED model store, so that a test bed never downloads
# 37-188 GB.
#
# It is deliberately NOT in the default roster (operator decision, ledger §9 #8): a card-less host
# would otherwise skip or fail this bed on every unrelated run. The umbrella's `check-all-beds`
# excludes it; it is run on demand with `charly check run <ns>.check-strata-gpu-pod`.
#
# It carries the candy's baked probes plus its own runtime checks (the env -> config projection,
# the engine-versus-stamp check, the pictures-on DEFAULT the candy's vision pass must produce, and
# the STRATA_RUN_ARGS surface).
check-strata-gpu-pod:
    pod:
        image: strata
        disposable: true
        lifecycle: dev
        # A GPU-CDI POD claims the REFCOUNTED axis: requires_shared flips the IOMMU group
        # vfio->nvidia+CDI at this bed's deploy and back only when the LAST claimant
        # releases. requires_exclusive is the VM/sole-use axis and asks for the flip TO
        # vfio -- measured 2026-10-17: declaring it on this pod made the arbiter try a
        # vfio switch, which a live desktop session (Hyprland) correctly refused.
        requires_shared: [nvidia-gpu]
        description: >-
            Sole proof the REAL engine serves: the baked engine loads a provisioned model store on a
            card that arrived through CDI, the config projection is what the deployment asked for,
            pictures are ON by the candy's own default, a real PNG round-trips through the encoder,
            and a completion round-trips. Needs the GPU venue and the encoder file in the store; run
            on demand, never in the default roster.
        env:
            FAMILY: qwen
            MODEL: IQ2_XS
            # Deliberately ABOVE the engine's own recommendation for this card, so the projection
            # assertion below can actually FAIL: `own_path_context` returns 32768 at <=16.5 GB of
            # VRAM and the venue's RTX 4080 measures 15.99 GB (65536 is its bracket only from
            # 16.5 GB; 131072 above 24.5 GB).
            CONTEXT: "65536"
            KV: k8v4
            GPU: "0"
            # Never `on` here: the venue has no container memory cap, and forcing the low-RAM path
            # would test the slow engine instead of the one people deploy.
            LOW_RAM: auto
            # The cgroup-aware server limit, in MiB (56 GiB of the 64 GB venue).
            STRATA_MEMORY_LIMIT_MIB: "57344"
            # Weights that are already on the venue: the bed never downloads them. (The encoder file
            # is store data beside them, and is the one thing the first start may fetch -- see the
            # venue-precondition note below.)
            GGUF_DIR: /gguf
            # Prove the Layer-C surface: the deployment's extra argv must reach the run config.
            STRATA_RUN_ARGS: "--vram-reserve-mib 832"
        volume:
            # Pre-existing GGUF files, read-write because the first start writes <shard>.done markers.
            # The provisioned shards live in models/<MODEL>/ on the venue store; gguf/<MODEL>/ exists but is
            # empty here, and binding it made the engine start and report `loaded: false` with
            # "--native /gguf/<shard>: missing model shard" in its own log. Measured 2026-10-19.
            - {name: gguf, type: bind, host: ~/.local/share/strata/models/IQ2_XS, path: /gguf}
            # The prepared pack, the MTP layer and the CONFIG live in the host store already: binding it
            # is what makes the launch skip the installer. As a named volume /data starts EMPTY, so the
            # entrypoint takes its install path and dies writing the read-only /opt/strata/.venv
            # ("PermissionError: .strata-pip.json" -> supervisord FATAL -> no listener; ledger §94-§97).
            - {name: strata-data, type: bind, host: ~/.local/share/strata, path: /data}
        secret:
            - name: STRATA_API_KEY
        # VENUE PRECONDITION (measured 2026-10-17): this bed names a specific venue and never downloads
        # WEIGHTS. `GGUF_DIR: /gguf` binds `~/.local/share/strata/gguf/IQ2_XS`, and the weights must
        # already be there; the ledger names the venue (`cachyos-gpu-workstation-vm`: 64G/12cpu/1T,
        # RTX 40 -> arch 89). A host with the matching card but no staged GGUF — host `a` has an
        # RTX 4080 SUPER and an empty store — cannot run it. Stating it here because "run on demand"
        # otherwise reads as "runnable anywhere".
        #
        # PICTURES add a second store precondition (2026-10-21). The encoder SOFTWARE is baked into the
        # image (`/opt/strata/engine/strata-vision`, 222 MB), but the encoder DATA FILE is model data
        # (about 907 MB) and lives BESIDE the weights in the model store — under `/data/vision/`, which
        # is `~/.local/share/strata/vision/` on this venue — or is downloaded ONCE on the first start.
        # It never enters the image: it is licensed with the weights and too large to duplicate per
        # image. The vision pass degrades LOUDLY and not silently (one line, pictures off, text still
        # served) when the file is neither present nor reachable, so a venue without it does not crash
        # the bed — it fails the pictures-on assertions below, which is the honest outcome.
        # The projection's VALUES, asserted only here: this bed builds a real run config from the
        # deployment's env: (the deterministic bed cannot -- its scripted engine starts with no config,
        # so its /health reports the engine defaults and an equality assertion there could not fail).
        # CONTEXT is deliberately 65536, NOT the engine's 32768 default, so this fails if the
        # env -> config -> server chain ever breaks.
        plan:
            - check: /health reports the context this deployment asked for, not an engine default
              id: strata-gpu-projection
              context: [runtime]
              exit_status: 0
              # The expectation is the literal this bed declares above (CONTEXT: "65536"), not a
              # reference to the CONTEXT variable: the check-var resolver does not see the pod env,
              # so a braced reference was skipped as unresolved -- an assertion silently absent. The
              # probe runs in-container (command: defaults to podman exec), so it dials the container
              # port, not HOST_PORT.
              command: >-
                  python3 -c "import json,sys,urllib.request;
                  h=json.load(urllib.request.urlopen('http://127.0.0.1:8080/health'));
                  sys.exit(0 if str(h.get('max_context'))=='65536' else 1)"
            - check: "the engine binary reports the version its stamp records (a stamp can lie -- upstream #2054)"
              id: strata-gpu-engine-version
              context: [runtime]
              exit_status: 0
              # Lives HERE, not in the candy: the binary loads libcuda, which CDI injects only at
              # runtime on a device-bearing host. It is the check that catches a stamp written over a
              # failed build -- exactly what upstream #2054 measured -- and it can only run where the
              # engine can actually load.
              command: >-
                  python3 -c "import json,subprocess,sys; m=json.load(open('/opt/strata/engine/BUILD.json'));
                  out=subprocess.run(['/opt/strata/engine/strata','--version'],capture_output=True,text=True).stdout;
                  sys.exit(0 if str(m.get('version','')) in out else 1)"
            - check: and pictures are ON by the deployment DEFAULT, not by anything this bed set
              id: strata-gpu-images
              context: [runtime]
              exit_status: 0
              # The bed deliberately sets NO vision variable, so this asserts the CANDY's default
              # posture: the charly vision pass writes the setup-owned vision section into the volume
              # run config on EVERY start, and the server then publishes the engine's own answer on
              # /health. A bed that pinned the variable would pass with the pass broken, which is
              # exactly the silent-ignore this change removes. Literalised for the same two reasons
              # as the projection step: the check-var resolver does not see the pod env, and the
              # in-container probe dials the container port, not the published host port.
              command: >-
                  python3 -c "import json,sys,urllib.request;
                  h=json.load(urllib.request.urlopen('http://127.0.0.1:8080/health'));
                  sys.exit(0 if h.get('images') is True else 1)"
            - check: the volume run config carries the vision section that flag comes from
              id: strata-gpu-vision-config
              context: [runtime]
              exit_status: 0
              # The config path is the bed's MODEL (IQ2_XS) lowercased by the entrypoint's own
              # `strata-<model>.json` rule -- the same literal the run-args step uses, because the
              # check-var resolver does not see the pod env. The probe runs in-container (command
              # defaults to podman exec), so it reads the VOLUME config, not the host store.
              # `lazy_load` is asserted NOT TRUE rather than left unchecked because upstream's settings
              # validator refuses that pair (serve/runconfig.py:92): a vision section beside lazy
              # loading is a config upstream's own API declines to write, so the vision pass turns it
              # off and the flag on /health and this pair must agree. The
              # encoder DATA path is asserted too, because it is the half that must NOT be in the
              # image: an mmproj path outside the model store is a config pointing at model data this
              # family deliberately does not bake. The next step follows the section's exe to the
              # artifact it names.
              command: >-
                  python3 -c "import json,sys;
                  c=json.load(open('/data/config/strata-iq2_xs.json')); v=c.get('vision');
                  sys.exit(0 if isinstance(v,dict) and v.get('gpu') is False
                  and c.get('lazy_load') is not True
                  and str(v.get('mmproj','')).startswith('/data/vision/') else 1)"
            - check: the encoder the config names is the one baked into this image, stamped for this engine
              id: strata-gpu-vision-binary
              context: [runtime]
              exit_status: 0
              # Two facts and the link between them. The section's exe is followed to the ARTIFACT: a
              # config naming an encoder the image does not carry would be a config that lies, and
              # executability as the SERVING USER is the property the build context cannot see (the
              # candy hands the whole tree to uid 1000 at build time). The stamp beside it is written
              # LAST by the bake, after both binaries, so a stamp recording "none" means the build
              # skipped the encoder while the config asks for pictures -- and a stamp that lies after
              # a failed build is the failure upstream #2054 measured.
              command: >-
                  python3 -c "import json,os,sys;
                  v=json.load(open('/data/config/strata-iq2_xs.json')).get('vision') or {};
                  exe=str(v.get('exe','')); m=json.load(open('/opt/strata/engine/BUILD.json'));
                  sys.exit(0 if exe=='/opt/strata/engine/strata-vision' and os.access(exe,os.R_OK|os.X_OK)
                  and m.get('vision') not in (None,'','none') else 1)"
            - check: a real picture round-trips and the answer names the colour
              id: strata-gpu-vision-roundtrip
              context: [runtime]
              exit_status: 0
              # The only assertion here that a config inspection cannot fake: it builds a real PNG in
              # the container (python3 zlib+struct, so no imaging library and nothing new installed),
              # posts it as a base64 data URL, and requires the colour word in the answer.
              # `eventually` is the documented poll-until-pass matcher, not a sleep: the engine loads
              # the weights and the encoder at start, which can take minutes on this venue, and the
              # FIRST pass returns immediately, reporting its attempt count instead of a bare timeout.
              # max_tokens 48 with reasoning_effort none is the measured pair that yields content
              # rather than a truncated null (the trap the candy's completion probe records). The
              # probe runs in-container, so the port is the container's own, not the host port.
              eventually: "900s"
              retry_interval: "15s"
              command: >-
                  python3 -c "import base64,json,os,struct,sys,urllib.request,zlib;
                  w=h=64; raw=b''.join(b'\x00'+bytes((255,0,0))*w for _ in range(h));
                  chunk=lambda t,d: struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff);
                  png=b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',w,h,8,2,0,0,0))+chunk(b'IDAT',zlib.compress(raw,9))+chunk(b'IEND',b'');
                  url='data:image/png;base64,'+base64.b64encode(png).decode();
                  body=json.dumps({'model':'strata','messages':[{'role':'user','content':[{'type':'text','text':'What colour is this image? Answer with one word.'},{'type':'image_url','image_url':{'url':url}}]}],'max_tokens':48,'reasoning_effort':'none'}).encode();
                  r=urllib.request.Request('http://127.0.0.1:8080/v1/chat/completions',data=body,headers={'Content-Type':'application/json','Authorization':'Bearer '+os.environ.get('STRATA_API_KEY','')});
                  c=json.load(urllib.request.urlopen(r))['choices'][0];
                  sys.exit(0 if 'red' in (c['message'].get('content') or '').lower() else 1)"
            - check: the deployment's STRATA_RUN_ARGS reached the run config's argv
              id: strata-gpu-run-args
              context: [runtime]
              exit_status: 0
              # The config path is the bed's MODEL (IQ2_XS) lowercased by the entrypoint's own
              # `strata-<model>.json` rule. The probe runs in-container (command defaults to
              # podman exec), so it reads the VOLUME config, not the host store.
              command: >-
                  python3 -c "import json,sys;
                  a=json.load(open('/data/config/strata-iq2_xs.json')).get('args',[]);
                  sys.exit(0 if '--vram-reserve-mib' in a and a[a.index('--vram-reserve-mib')+1]=='832' else 1)"
