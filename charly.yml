# layer-strata — the Strata ENGINE LAYER, and nothing else.
#
# The class is deliberate (umbrella `AGENTS.md`, "Repo classes and naming"): a product family is a
# `layer-<family>` repo, never a bare name. This repo holds the candy (`candy/strata`) and the skill
# that documents it.
#
# The POD that composes it — the `strata` image and the disposable GPU bed that proves it — lives in
# **opencharly/pod-strata** (opencharly/opencharly#1174, decision record
# `plan/strata-pod-and-engine-v0216-ledger.md`). That repo pins THIS candy by tag
# (`@github.com/opencharly/layer-strata/candy/strata:v<tag>`), which is why the candy's own address is
# unchanged by the split while its box, its bed, its `import:` and its image `defaults:` are no longer
# here: a repo that declares no image builds nothing, deploys nothing and needs none of them.
#
# `charly box validate` at this root still checks the candy — it is the one entity this repo owns.
repo: github.com/opencharly/layer-strata
discover:
    - path: candy
      recursive: true
